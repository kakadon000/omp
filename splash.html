<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMP</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
      /* v0.15.0 — a floating rounded glass card, not a sharp window rect:
         the window itself is transparent, so the rounded clip + stroke +
         shadow land directly on the desktop. No window material is applied
         (Mica would paint the rect sharp behind this). */
      body { padding: 26px; }
      .scene {
        height: 100%; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(180deg, rgba(16, 18, 26, 0.78), rgba(10, 12, 18, 0.86));
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .card { text-align: center; user-select: none; }
      .logo { width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 24px;
        box-shadow: 0 12px 40px rgba(0, 30, 80, 0.45); display: block; }
      .word { color: #fff; font-size: 30px; font-weight: 600; letter-spacing: 0.14em; }
      .tag { color: rgba(255, 255, 255, 0.55); font-size: 12.5px; margin-top: 6px; letter-spacing: 0.04em; }
      .bar { width: 180px; height: 3px; border-radius: 99px; background: rgba(255, 255, 255, 0.14);
        margin: 22px auto 0; overflow: hidden; position: relative; }
      .bar i { position: absolute; top: 0; left: -40%; width: 40%; height: 100%; border-radius: 99px;
        background: var(--accent, #4cc2ff); animation: slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      @keyframes slide { to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { .bar i { animation: none; left: 30%; } }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="card">
        <img class="logo" src="./icon-512.png" alt="OMP" />
        <div class="word">OMP</div>
        <div class="tag">Every Format. One Player. Open to All.</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </body>
</html>
