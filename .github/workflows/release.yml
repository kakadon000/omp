name: Release — Windows build (smoke-gated)

# PIPELINE: build → SMOKE (launch OMP 3x on a real Windows desktop) → publish.
# The GitHub release is created ONLY if every smoke boot passes, so a build
# that cannot start on a real Windows machine can never reach the releases
# page again.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_BODY: >-
    Every Format. One Player. Open to All. — v0.15.8: TESTED ON REAL WINDOWS BEFORE IT SHIPS. No more blind releases — this build was launched on a real Windows machine NINE times before it was published: a fresh first boot, the exact rescue boot a broken machine takes, a normal boot after a clean exit, a forced opaque+GPU boot, and a five-configuration engine-flag matrix (GPU, software rendering, no DirectComposition, SwiftShader, software compositing). Every launch was hard-checked for a live process, the boot handshake, the absence of crash reports, the correct engine flags and a sane window tree, with screenshots, window-tree dumps and boot logs kept as evidence — the release exists only because every hard check passed. The gate also drove two real correctness fixes into the app: THE CONTROLLER RULE — WebView2 keeps its own visibility flag that does not follow the window, and OMP's windows are created hidden and shown later, so every show now shows both the window AND the webview controller, and re-asserts the controller visibility and bounds through the platform handle (two gaps verified in the engine sources); and OPAQUE SAFE MODE — safe graphics never builds glass anymore, it uses only the opaque window profiles, so a rescued machine physically cannot show a transparent void even with a sick compositor; glass stays a healthy-machine feature. NEW RESCUE VALVE: OMP_EXTRA_WEBVIEW_ARGS — set it as a user environment variable and its flags are applied to the engine identically for every window in both modes, with the boot log recording exactly what ran; if your machine is in the webview-runs-but-shows-nothing state, candidate cures can now be tested on YOUR machine in seconds without new builds (try OMP_EXTRA_WEBVIEW_ARGS=--use-angle=swiftshader first, then --disable-gpu-compositing; remove the variable after testing). Reports also name the WebView2 runtime correctly on machines without Edge. Everything else stays: identical engine flags for every window, the window ladder, hung-process cleanup, never-silent Desktop reports, the panic guard, pre-boot recovery and the embedded WebView2 installer. If anything still misbehaves, the OMP-report.txt on your Desktop says OMP v0.15.8 in the header and records the exact engine flags of every launch — send that one. Download the Windows installer below.

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Fetch libmpv engine + stage bundle resources
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path src-tauri/resources/media | Out-Null
          # 1) bundle the demo videos next to the exe so mpv can open them by path
          Copy-Item public/media/*.mp4 src-tauri/resources/media/
          # 2) download the libmpv dev build (GPL — full codec set: MKV/HEVC/AVI/WMV/FLV...)
          # GITHUB_TOKEN auth: the shared runner IP hits the anonymous 60/hr
          # API limit far too often — authenticated calls get 1000/hr.
          $headers = @{
            "User-Agent"    = "omp-ci-build"
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
          }
          $rel = $null
          for ($i = 1; $i -le 5; $i++) {
            try {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest" -Headers $headers
              break
            } catch {
              Write-Host "API attempt $i failed: $($_.Exception.Message)"
              # fallback: if the token is rejected, try anonymous before giving up
              $headers.Remove("Authorization") | Out-Null
              if ($i -eq 5) { throw }
              Start-Sleep -Seconds (20 * $i)
            }
          }
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*v3*" } | Select-Object -First 1
          if (-not $asset) { throw "no mpv-dev asset found in latest release" }
          Write-Host "Downloading $($asset.name)"
          # NO auth header here: the download redirects to the release CDN and
          # forwarding the bearer token breaks the signed request
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z -Headers @{ "User-Agent" = "omp-ci-build" }
          7z x mpv-dev.7z -ompvdev | Out-Null
          # zhongfly builds ship the engine as libmpv-2.dll (flat archive).
          # v0.9.0: pick it by NAME (never "first dll found"), verify the size
          # so a renamed/wrong artifact can never ship as the engine again.
          $dll = Get-ChildItem -Recurse -Filter "libmpv-2.dll" mpvdev | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse -Filter *.dll mpvdev | Sort-Object Length -Descending | Select-Object -First 1
          }
          if (-not $dll) { throw "no dll found in mpv-dev archive" }
          if ($dll.Length -lt 20MB) { throw "engine dll suspiciously small ($($dll.Length) bytes) — refusing to stage it" }
          Copy-Item $dll.FullName src-tauri/resources/mpv-2.dll
          Write-Host "Engine dll: $($dll.Name) ($([math]::Round($dll.Length/1MB,1)) MB)"
          # 3) bundle ffmpeg for the Phase 4 editor export pipeline
          # (BtbN GPL build — libx264 / libvpx-vp9 / libopus all in.
          #  BtbN retires asset names over time (the old "release-latest"
          #  name 404'd in v0.9.1, the n8.1 name 404'd in v0.15.8) —
          #  resolve the CURRENT stable asset from the release's asset
          #  list instead of hardcoding a filename.)
          $ffheaders = @{
            "User-Agent"    = "omp-ci-build"
            "Accept"        = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
          }
          $ffrel = $null
          for ($i = 1; $i -le 5; $i++) {
            try {
              $ffrel = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers $ffheaders
              break
            } catch {
              Write-Host "BtbN API attempt $i failed: $($_.Exception.Message)"
              $ffheaders.Remove("Authorization") | Out-Null
              if ($i -eq 5) { throw }
              Start-Sleep -Seconds (20 * $i)
            }
          }
          $ffasset = $ffrel.assets |
            Where-Object { $_.name -like "ffmpeg-n*-latest-win64-gpl-*.zip" -and $_.name -notlike "*shared*" } |
            Select-Object -First 1
          if (-not $ffasset) {
            $ffasset = $ffrel.assets |
              Where-Object { $_.name -like "ffmpeg-*latest-win64-gpl-*.zip" -and $_.name -notlike "*shared*" -and $_.name -notlike "*master*" } |
              Select-Object -First 1
          }
          if (-not $ffasset) { throw "no win64-gpl ffmpeg asset found in BtbN latest release" }
          Write-Host "FFmpeg asset: $($ffasset.name)"
          # curl.exe (bundled with the runner) — IWR can silently land an HTML
          # error page on release-asset redirects; curl --fail cannot, and a
          # size guard + visible 7z log make any failure diagnosable
          # Windows runners: Defender false-positives on static ffmpeg builds
          # and quarantines the exe right after extraction (7z still reports
          # Ok, the file just vanishes) — exclude the workspace first.
          try { Add-MpPreference -ExclusionPath (Get-Location).Path -ErrorAction Stop } catch { Write-Host "Defender exclusion failed: $($_.Exception.Message)" }
          # NO auth header here: the download redirects to the release CDN
          curl.exe -sSL --fail --retry 5 --retry-delay 5 -A omp-ci-build -o ffmpeg-bn.zip $ffasset.browser_download_url
          $zsize = (Get-Item ffmpeg-bn.zip).Length
          Write-Host "ffmpeg zip: $([math]::Round($zsize/1MB,1)) MB"
          if ($zsize -lt 104857600) { throw "ffmpeg zip too small ($zsize bytes) — download did not yield the archive" }
          # flat-extract ONLY the console tools straight into resources/
          7z e ffmpeg-bn.zip -osrc-tauri/resources -y "*/bin/ffmpeg.exe" > 7z-ff.log
          if ($LASTEXITCODE -ne 0) { Get-Content 7z-ff.log -Tail 25; throw "7z could not extract the ffmpeg zip (exit $LASTEXITCODE)" }
          if (-not (Test-Path src-tauri/resources/ffmpeg.exe)) {
            Get-Content 7z-ff.log -Tail 25
            try { Get-MpThreatDetection -ErrorAction Stop | Select-Object -Last 5 | Format-List | Out-String | Write-Host } catch {}
            throw "ffmpeg.exe did not land in resources (likely quarantined — see detections above)"
          }
          $fflen = (Get-Item src-tauri/resources/ffmpeg.exe).Length
          Write-Host "FFmpeg: $([math]::Round($fflen/1MB,1)) MB"
          # 4) bundle yt-dlp — the built-in YouTube extractor (v0.9.0):
          #    keyless search (online_yt_search) + native mpv playback of
          #    YouTube and 1000+ other sites via the ytdl hook
          curl.exe -sSL --fail --retry 5 --retry-delay 5 -A omp-ci-build -o src-tauri/resources/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          if (-not (Test-Path src-tauri/resources/yt-dlp.exe)) { throw "yt-dlp.exe did not land in resources" }
          $ylen = (Get-Item src-tauri/resources/yt-dlp.exe).Length
          if ($ylen -lt 10MB) { throw "yt-dlp.exe suspiciously small ($ylen bytes)" }
          Write-Host "Staged resources:"
          Get-ChildItem -Recurse src-tauri/resources | Select-Object FullName, Length

      - name: Build OMP (NSIS installer + MSI — build only, publish comes after smoke)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # deliberately NO tagName: tauri-action builds without publishing.
        # The release is created by the `publish` job — and only if the
        # smoke-windows job proves the exe actually boots on a real desktop.

      - name: Upload build artifacts (for smoke test + publish)
        uses: actions/upload-artifact@v4
        with:
          name: omp-build
          path: |
            src-tauri/target/release/OMP.exe
            src-tauri/target/release/resources/**
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  smoke-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: omp-build
          path: smoke-stage

      - name: Launch OMP on a real Windows desktop (fresh / rescue / normal)
        shell: pwsh
        run: .github/smoke/run-smoke.ps1 -StageDir smoke-stage

      - name: Upload smoke evidence (screenshots + boot logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp-smoke-evidence
          path: smoke-out/
          if-no-files-found: error

  publish:
    needs: [build-windows, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omp-build
          path: dist

      - name: Create the GitHub release (only reached when smoke passed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "${{ env.RELEASE_BODY }}" > body.md
          # --repo: this job has no checkout — without it gh shells out to
          # git to discover the repository and dies ("not a git repository")
          gh release create "${{ github.ref_name }}" \
            dist/bundle/nsis/*_x64-setup.exe \
            dist/bundle/msi/*_x64_en-US.msi \
            --repo "${{ github.repository }}" \
            --title "OMP ${{ github.ref_name }}" \
            --notes-file body.md
