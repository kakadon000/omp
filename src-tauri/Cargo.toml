[package]
name = "omp"
version = "0.6.1"
edition = "2021"
description = "OMP — Open Media Player. Every Format. One Player. Open to All."
license = "GPL-3.0-or-later"
default-run = "omp"

[lib]
name = "omp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
